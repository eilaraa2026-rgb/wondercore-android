name: WonderCore Android Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail
          echo "WonderCore Android Build Pipeline"
          echo "GitHub Actions runner started successfully."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          uname -a
          java -version