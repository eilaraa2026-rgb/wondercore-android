name: Build Quill Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - 
      - name: Set project directory
      - name: Extract Android source
  shell: bash
  run: |
    set -e

    ZIP_FILE=$(find . -maxdepth 1 -type f \( \
      -name "WonderCore_Android_Source*.zip" -o \
      -name "Quill_Studio_Android_Source*.zip" \
      \) | head -n 1)

    if [ -z "$ZIP_FILE" ]; then
      echo "No Android source ZIP found."
      exit 1
    fi

    echo "Using: $ZIP_FILE"

    rm -rf extracted
    mkdir extracted

    unzip "$ZIP_FILE" -d extracted
      
        run: |
          if [ -f extracted/settings.gradle ]; then
            echo "PROJECT_DIR=extracted" >> $GITHUB_ENV
          elif [ -f extracted/Quill_Studio_Android_Source_v0.1/settings.gradle ]; then
            echo "PROJECT_DIR=extracted/Quill_Studio_Android_Source_v0.1" >> $GITHUB_ENV
          else
            echo "Could not find settings.gradle after extraction"
            find extracted -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quill-Studio-Android-v0.1-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
