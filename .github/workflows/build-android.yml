 name: Build WonderCore Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WonderCore_Android_Source*.zip"
      - "Quill_Studio_Android_Source*.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'WonderCore_Android_Source*.zip' \
            ! -name '*.sha256' \
            | sort -V \
            | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f \
              -name 'Quill_Studio_Android_Source*.zip' \
              ! -name '*.sha256' \
              | sort -V \
              | tail -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Android source ZIP was found."
            exit 1
          fi

          echo "Selected source ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::The project does not contain an app module."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          /opt/gradle/gradle-8.9/bin/gradle --version

      - name: Regenerate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

            - name: Run Build Doctor
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "WonderCore Build Doctor"
          echo "Project root: $(pwd)"

          test -f settings.gradle || {
            echo "::error::settings.gradle is missing."
            exit 1
          }

          test -f build.gradle || {
            echo "::error::build.gradle is missing."
            exit 1
          }

          test -d app || {
            echo "::error::Android app directory is missing."
            exit 1
          }

          test -f app/build.gradle || {
            echo "::error::app/build.gradle is missing."
            exit 1
          }

          test -x gradlew || {
            echo "::error::Gradle wrapper is not executable."
            exit 1
          }

          echo "WonderCore project structure validated." 

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK_FILE")"
          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -le 50000 ]; then
            echo "::error::The APK is suspiciously small and was rejected."
            exit 1
          fi

          mkdir -p build-output

          cp "$APK_FILE" \
            build-output/WonderCore-v0.2-debug.apk

          sha256sum \
            build-output/WonderCore-v0.2-debug.apk \
            > build-output/WonderCore-v0.2-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderCore-v0.2-Installable-APK
          path: |
            build-output/WonderCore-v0.2-debug.apk
            build-output/WonderCore-v0.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
