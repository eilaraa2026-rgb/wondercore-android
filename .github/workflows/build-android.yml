name: Build WonderCore Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WonderCore_Android_Source*.zip"
      - "Quill_Studio_Android_Source*.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./WonderCore_Android_Source_v0.2_CANON_ICON_7.8.zip"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No WonderCore Android source ZIP was found."
            echo "Repository root contains:"
            ls -la
            exit 1
          fi

          echo "Using source archive: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-source
          mkdir -p extracted-source

          unzip -q "${{ steps.source.outputs.zip_file }}" \
            -d extracted-source

          echo "Source extracted successfully."
          find extracted-source -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted-source -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Android Gradle project was found inside the ZIP."
            find extracted-source -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
      - name: Prepare clean Gradle wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Removing bundled Gradle wrapper files..."
          rm -f gradlew
          rm -f gradlew.bat
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties

          echo "Generating trusted Gradle 8.9 wrapper..."
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper regenerated successfully."
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Package WonderCore APK
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Gradle finished but no debug APK was found."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p build-output

          cp "$APK_FILE" \
            build-output/WonderCore-v0.2-debug.apk

          sha256sum \
            build-output/WonderCore-v0.2-debug.apk \
            > build-output/WonderCore-v0.2-debug.apk.sha256

          echo "APK successfully packaged:"
          ls -lh build-output/

      - name: Upload WonderCore APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderCore-v0.2-Installable-APK
          path: |
            build-output/WonderCore-v0.2-debug.apk
            build-output/WonderCore-v0.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30